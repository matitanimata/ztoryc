# Ztoryc preview — a TEST build of master, macOS + Windows, made ON REQUEST.
#
# Decided with Franco on 2026-09-24. We first planned nightly builds, then
# chose this instead: on master we work directly, and Franco tries things
# before anyone else gets them, so nothing should go out on its own. A preview
# is built only when he asks for one — typically to hand a fix to a tester
# before the next release (what used to be a hand-made installer on Drive).
#
#   - started by hand only: `gh workflow run preview.yml` (or Actions → Run);
#   - macOS and Windows only (Linux takes ~97 min; the testers are on the
#     other two);
#   - ONE "preview" pre-release, replaced each time, never marked latest, with
#     the commit in its title and in the file names, and a line saying it is
#     not for real work. About shows the commit and a PREVIEW warning.
#
# ⚠️ It refuses to start while a macOS build is running. The macOS build's
# concurrency group is keyed on the ref only (see macOS_build.yml), so a
# preview dispatched on master would CANCEL a release build running on master.
name: Ztoryc Preview

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - name: No macOS build may be running
        run: |
          set -euo pipefail
          BUSY=$(gh run list --workflow macOS_build.yml --limit 20 --json status \
                   --jq '[.[] | select(.status != "completed")] | length')
          if [ "$BUSY" != "0" ]; then
            echo "::error::$BUSY macOS build(s) running (a release?). Starting now would cancel them: try again when they have finished."
            exit 1
          fi
      - name: Replace the preview pre-release
        run: |
          set -euo pipefail
          HEAD=$(git rev-parse HEAD)
          SHORT="${HEAD::9}"
          DATE=$(date -u +%F)
          cat > notes.md <<EOF
          ⚠️ **Preview build — for testing, not for real work.** Built on request from \`master\` at \`${SHORT}\` (${DATE}): it may contain unfinished work. For production use the [latest release](https://github.com/${GITHUB_REPOSITORY}/releases/latest). When reporting a problem, say which commit About shows.

          *⚠️ **Build di prova — per provare, non per lavorare.** Costruita su richiesta da \`master\` al commit \`${SHORT}\` (${DATE}): può contenere lavoro non finito. Per lavorare usa l'[ultima release](https://github.com/${GITHUB_REPOSITORY}/releases/latest). Se segnali un problema, indica il commit che compare in About.*

          macOS and Windows only; same installation notes as the latest release.
          *Solo macOS e Windows; per l'installazione valgono le note dell'ultima release.*
          EOF
          gh release delete preview --yes --cleanup-tag 2>/dev/null || true
          gh release create preview --prerelease --latest=false \
            --target "$HEAD" \
            --title "Ztoryc preview ${DATE} (${SHORT})" \
            --notes-file notes.md
      - name: Start the macOS and Windows builds
        run: |
          set -euo pipefail
          gh workflow run macOS_build.yml --ref master -f preview=true
          gh workflow run windows_build.yml --ref master -f preview=true
